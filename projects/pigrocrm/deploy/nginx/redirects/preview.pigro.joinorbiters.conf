# preview.pigro.joinorbiters.com -> preview.pigro.letsrebase.com since 2026-09-14 (ORB-193): the platform moved to letsrebase.com.
# One answer for every path, method preserved on 308. TLS keeps the old certificate so
# the redirect itself is served over https; certbot renews it as before.
# Record: docs/migrations/2026-09-14-letsrebase.md in the repository.
server {
    server_name preview.pigro.joinorbiters.com;
    return 308 https://preview.pigro.letsrebase.com$request_uri;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/preview.joinorbiters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.joinorbiters.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name preview.pigro.joinorbiters.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://preview.pigro.letsrebase.com$request_uri; }
}
